<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт — Задание 5</title>
    <link rel="stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body id="top">
    <header>
        <a href="https://destinnnyyy.github.io/"><img src="logo.png" alt="Логотип сайта" width="60" height="60"></a>
        <nav>
            <a href="#calc">Калькулятор</a>
            <a href="https://destinnnyyy.github.io/web4/">Задание 4</a>
        </nav>
    </header>

    <main>
        <h1>Web-Swag</h1>

        <h2 id="calc">Калькулятор стоимости заказа</h2>
        <form id="calc-form">
            <p>
                <label for="product">Товар:</label>
                <select id="product" name="product">
                    <option value="100">Блокнот — 100 руб.</option>
                    <option value="250">Рюкзак — 250 руб.</option>
                    <option value="1200">Наушники — 1200 руб.</option>
                </select>
            </p>
            <p>
                <label for="quantity">Количество:</label>
                <input id="quantity" name="quantity" type="text" autocomplete="off">
            </p>
            <p>
                <button id="calc-button" type="submit">Рассчитать</button>
            </p>
        </form>
        <p id="result"></p>
    </main>

    <footer>
        <a href="#top">↑ Наверх</a>
        <p>© 2026 Мой сайт</p>
    </footer>
</body>
</html>
