<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт — Задание 5</title>
    <link rel="stylesheet" href="style.css">
    <script src="calc.js" defer></script>
</head>
<body id="top">
    <header class="site-header">
        <div class="header-inner">
            <div class="brand">
                <a href="https://destinnnyyy.github.io/">
                    <img class="logo" src="logo.png" alt="Логотип сайта">
                </a>
                <h1>Web-Swag</h1>
            </div>
        </div>
    </header>

    <main class="container">
        <section>
            <h2 id="calc">Калькулятор стоимости заказа</h2>
            <form id="calc-form">
                <p>
                    <label for="product">Товар:</label>
                    <select id="product" name="product">
                        <option value="100">Блокнот — 100 руб.</option>
                        <option value="250">Рюкзак — 250 руб.</option>
                        <option value="1200">Наушники — 1200 руб.</option>
                    </select>
                </p>
                <p>
                    <label for="quantity">Количество:</label>
                    <input id="quantity" name="quantity" type="text" autocomplete="off">
                </p>
                <p>
                    <button id="calc-button" type="submit">Рассчитать</button>
                </p>
            </form>
            <p id="result"></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>© 2026 Мой сайт</p>
    </footer>
</body>
</html>
